steps:
  # Paso 1: Compilar la imagen Docker
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/eco-wind:latest"
      - "-f"
      - "Dockerfile"
      - "."
    timeout: "1800s"  # 30 minutos timeout
    env:
      - "DOCKER_BUILDKIT=1"
      - "BUILDKIT_INLINE_CACHE=1"

  # Paso 2: Hacer push de la imagen a Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
    timeout: "600s"

  # Paso 3: Desplegar en Cloud Run
  - name: "gcr.io/cloud-builders/run"
    args:
      - "deploy"
      - "eco-wind"
      - "--image"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
      - "--region"
      - "us-central1"  # Cambia a tu región preferida
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      # 4Gi (antes 2Gi, y 1Gi originalmente) y --cpu-boost: el error real
      # reportado era "STARTUP TCP probe failed... DEADLINE_EXCEEDED" -- el
      # contenedor no llegaba a escuchar en el puerto a tiempo. Streamlit +
      # pandas + numpy + plotly + folium es un import pesado; con sólo 1 CPU y
      # sin boost de arranque, Cloud Run puede tardar más en levantar el
      # proceso de lo que dura el probe de arranque, o el proceso puede
      # quedarse sin memoria (que se ve igual que un timeout, porque el
      # contenedor nunca llega a abrir el puerto). --cpu-boost da CPU completa
      # sólo durante el arranque (no cuesta más en régimen normal, se apaga
      # después del arranque).
      #
      # Segundo bug real encontrado (Hallazgo 60): con 2Gi, el botón "Generar
      # informe ejecutivo (PDF)" hacía que la sesión entera "brincara"/se
      # reconectara -- el informe lanza un Chromium real (kaleido, para
      # exportar los gráficos a PNG), y ese Chromium sumado a Streamlit +
      # pandas + numpy + plotly + folium YA cargados en memoria empujaba el
      # contenedor sobre el límite -- Cloud Run lo mata y reinicia (se ve
      # igual que la app "reiniciándose", y se pierde todo el session_state en
      # memoria, incluido el tipo de cambio BCCR ya cacheado, que vuelve al
      # valor de emergencia). Subir a 4Gi le da margen real a Chromium.
      - "--memory"
      - "4Gi"
      - "--cpu"
      - "1"
      - "--cpu-boost"
      - "--timeout"
      - "3600s"
      # NOTA: NO agregar "--set-env-vars PORT=8080" ni ninguna variable
      # llamada PORT. Cloud Run reserva ese nombre y lo asigna
      # automáticamente a partir del flag --port de arriba; si se
      # sobrescribe manualmente, el despliegue puede quedar en un estado
      # inconsistente y el probe de salud falla con DEADLINE_EXCEEDED.
      # Descomentar y actualizar si usas Secret Manager:
      # - "--set-secrets"
      # - "GOOGLE_SHEETS_API_KEY=projects/$PROJECT_ID/secrets/google-sheets-api-key/versions/latest"
      #
      # Token del BCCR (motor de tipo de cambio, engine/tipo_cambio_bccr.py):
      # el secreto ya existe en Secret Manager con el nombre BCCR_BEARER_TOKEN
      # (proyecto eco-wind). Requiere haber corrido antes, una sola vez:
      #   gcloud secrets add-iam-policy-binding BCCR_BEARER_TOKEN \
      #     --member="serviceAccount:PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
      #     --role="roles/secretmanager.secretAccessor"
      # (PROJECT_NUMBER = 372045805718 para este proyecto). Sin ese permiso,
      # el despliegue falla al no poder montar el secreto.
      - "--set-secrets"
      - "BCCR_BEARER_TOKEN=BCCR_BEARER_TOKEN:latest"
    timeout: "600s"

# Configuración de la compilación
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "N1_HIGHCPU_8"  # Machine type más rápida para compilaciones
  substitutionOption: "ALLOW_LOOSE"

# Imágenes que se buildean y se pushean
images:
  - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/eco-wind:latest"

# Substituciones (variables que se pueden usar en el build)
substitutions:
  _REGION: "us-central1"
  _SERVICE_NAME: "eco-wind"

# Timeout total del build
timeout: "3600s"

# Tags para organizar los builds
tags:
  - "gcp-cloud-build-deploy"
  - "eco-wind"
