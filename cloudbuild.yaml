steps:
  # Paso 1: Compilar la imagen Docker
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/eco-wind:latest"
      - "-f"
      - "Dockerfile"
      - "."
    timeout: "1800s"  # 30 minutos timeout
    env:
      - "DOCKER_BUILDKIT=1"
      - "BUILDKIT_INLINE_CACHE=1"

  # Paso 2: Hacer push de la imagen a Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
    timeout: "600s"

  # Paso 3: Desplegar en Cloud Run
  - name: "gcr.io/cloud-builders/run"
    args:
      - "deploy"
      - "eco-wind"
      - "--image"
      - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
      - "--region"
      - "us-central1"  # Cambia a tu región preferida
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      - "--timeout"
      - "3600s"
      # NOTA: NO agregar "--set-env-vars PORT=8080" ni ninguna variable
      # llamada PORT. Cloud Run reserva ese nombre y lo asigna
      # automáticamente a partir del flag --port de arriba; si se
      # sobrescribe manualmente, el despliegue puede quedar en un estado
      # inconsistente y el probe de salud falla con DEADLINE_EXCEEDED.
      # Descomentar y actualizar si usas Secret Manager:
      # - "--set-secrets"
      # - "GOOGLE_SHEETS_API_KEY=projects/$PROJECT_ID/secrets/google-sheets-api-key/versions/latest"
    timeout: "600s"

# Configuración de la compilación
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "N1_HIGHCPU_8"  # Machine type más rápida para compilaciones
  substitutionOption: "ALLOW_LOOSE"

# Imágenes que se buildean y se pushean
images:
  - "gcr.io/$PROJECT_ID/eco-wind:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/eco-wind:latest"

# Substituciones (variables que se pueden usar en el build)
substitutions:
  _REGION: "us-central1"
  _SERVICE_NAME: "eco-wind"

# Timeout total del build
timeout: "3600s"

# Tags para organizar los builds
tags:
  - "gcp-cloud-build-deploy"
  - "eco-wind"
